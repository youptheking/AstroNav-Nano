$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: YoupSpace Docs
  structure:
    - type: section
      key: section-1
      title: Home
      path: home
      icon: house
      default: true
      children:
        - type: space
          key: space-1
          title: Home
          path: home
          default: true
          content:
            directory: ./home
    - type: section
      key: section-2
      title: Documentation
      path: documentation
      icon: book-blank
      children:
        - type: space
          key: space-2
          title: Documentation
          path: documentation
          default: true
          content:
            directory: ./documentation
    - type: section
      key: section-6
      title: Safety warning
      path: safety-warning
      description: ""
      icon: book-blank
      children:
        - type: space
          key: space-6
          title: Safety warning
          path: copy-of-documentation
          default: true
          draft: true
          content:
            directory: ./copy-of-documentation
        - type: space
          key: space-3
          title: Safety warnings
          path: help-center
          draft: true
          content:
            directory: ./safety-warning/help-center
    - type: section
      key: section-4
      title: Changelog
      path: changelog
      icon: clock-rotate-left
      children:
        - type: space
          key: space-4
          title: Changelog
          path: changelog
          default: true
          content:
            directory: ./changelog
    - type: section
      key: section-5
      title: Help Center
      path: help-center
      icon: life-ring
      children:
        - type: space
          key: space-5
          title: Help Center
          path: help-center
          default: true
          content:
            directory: ./help-center
