; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
upload_port = COM8
monitor_speed = 115200
board_build.filesystem_size = 1M
extra_scripts = pre:generate_version.py

; Recovery only: set true when an existing board cannot boot far enough for
; DUMP_OTP, but is already provisioned and is currently in RP2350 BOOTSEL mode.
; This bypasses host-side OTP probing; it does not enable OTP provisioning.
custom_otp_preflight_bypass = false

lib_deps = 
	adafruit/Adafruit NeoPixel@^1.12.0
	SparkFun/SparkFun BMP581 Arduino Library@^1.0.0
	weoiss/ICM-42688@1.0.1
